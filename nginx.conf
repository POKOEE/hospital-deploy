server {
    listen 80;
    server_name hospital.localhost;
    return 301 https://$host$request_uri;
}

# Основной сервер HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name hospital.localhost;

    # Пути к сертификатам внутри контейнера
    ssl_certificate /etc/nginx/certs/hospital.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/hospital.localhost-key.pem;

    # Сжатие для ускорения
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        # Перенаправляем на сервис 'app' на порт 8080
        proxy_pass http://app:8080;
        
        # Передача заголовков
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}