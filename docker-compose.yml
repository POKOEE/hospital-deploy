services:
  app:
    # Две точки означают "взять Dockerfile из папки уровнем выше" (из корня HospitalWeb)
    build: .. 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Строка подключения к SQLite (файл создастся в папке /app/data)
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/hospital.db
    volumes:
      # Сохраняем базу данных на компьютере, чтобы она не пропала
      - db-data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      # Монтируем конфиг nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Монтируем папку с сертификатами (она должна быть внутри папки nginx!)
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data: